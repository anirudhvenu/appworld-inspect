title: "AppWorld: A Controllable World of Apps and People for Benchmarking Interactive Coding Agents"
description: |
  Agents accomplish day-to-day digital tasks for a supervisor by writing
  Python against 457 APIs across 9 simulated apps (email, payments, music,
  shopping, etc.). Success is judged by programmatic checks on the resulting
  database state, robust to valid alternative solutions. Includes 750 tasks
  across train/dev/test_normal/test_challenge splits.
arxiv: https://arxiv.org/abs/2407.18901
group: Assistants
contributors:
  - anirudhvenu
version: "1-A"
tags:
  - Agent
  - Tools
tasks:
  - name: appworld
    dataset_samples: 168
metadata:
  requires_internet: false
  sandbox:
    - docker
  environment: appworld==0.1.3.post1
